[project]
name = "gradiens"
version = "0.1.0"
description = "Raccoglie notizie da YouTube, arXiv e siti web, le filtra con un LLM in base ai tuoi interessi e le riassume in italiano."
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "fastapi",
    "feedparser>=6.0.14",
    "httpx",
    "jinja2",
    "pydantic-settings",
    "python-multipart",
    "python-telegram-bot>=22",
    "sqlalchemy",
    "trafilatura>=2.3.1",
    "uvicorn",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
gradiens = "gradiens.app.cli:main"

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",  # linter e formatter (decisione 47); versione fissata da uv.lock
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120  # la lunghezza prevalente nel codice (docs/miglioramenti/05-dipendenze-e-stile.md, punto 5)
# target-version non serve: ruff lo ricava da requires-python.

[tool.ruff.lint]
# Regole predefinite (E4, E7, E9, F) più righe lunghe (E501: il formatter non spezza stringhe e commenti),
# import in ordine (I), errori probabili (B), sintassi moderna (UP). Niente regole N: i nomi italiani vanno bene così.
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gradiens"]

[tool.ruff.format]
# Stile predefinito (virgolette doppie, come già tutto il codice). Le migrazioni restano come Alembic le ha scritte.
exclude = ["src/gradiens/dati/migrazioni/versions/*"]
